workflow:
  key: a36822ff-2dba-4dd6-8935-f4070d2383ff
  title: 
    de: VASA Abgeltung
    fr: OTAS Indemnisation
    it: OTaRSi Insediamento
  version: 1
  time_period: 90
  start_task_ref: abgeltung_starten
  min_per_entity: 0
  max_per_entity: null
  tasks:

    abgeltung_starten:
      key: ac65c57b-b610-4383-be3b-38d7d4d25f28
      time_period: 7
      title: 
        de: VASA Abgeltung starten
        fr: Démarrer l'indemnisation OTAS
        it: Avvio della compensazione OTaRSi
      steps:

      - key: 75519fff-2206-4c45-9506-bd95a4b89b36
        time_period: 7
        title: 
          de: Prüfung der Abgeltungsvoraussetzungen
          fr: Examen des conditions d'indemnisation
          it: Esame dei requisiti di compensazione
        type: form
        name: pruefung_voraussetzungen
        fields:
        - name: ueber_250000
          type: str
          choices:
          - label: 
              de: Sanierungskosten über 250'000 CHF / Anhörung BAFU starten
              fr: Coûts d'assainissement supérieurs à 250'000 CHF / Lancer la consultation de l'OFEV
              it: Costi di risanamento superiori a 250 000 franchi / Avvio della consultazione con l'UFAM
            value: ja
          - label: 
              de: Sanierungskosten unter 250'000 CHF / Auszahlungsgesuch an BAFU einreichen
              fr: Coûts d'assainissement inférieurs à 250 000 CHF / Soumettre une demande de versement à l'OFEV
              it: Costi di risanamento inferiori a 250'000 franchi / Presentazione della domanda di pagamento all'UFAM
            value: nein
      
      links:
      - task_ref: anhoerung
        condition: form.pruefung_voraussetzungen.ueber_250000 == `ja`
      - task_ref: auszahlungsgesuch
        condition: form.pruefung_voraussetzungen.ueber_250000 == `nein`
      start_task: true
    
    anhoerung:
      key: eb1e4840-0afb-413d-83d5-b447d22bda7d
      time_period: 7
      title: 
        de: Anhörung BAFU
        fr: Audition OFEV
        it: Consultazione UFAM
      steps:

      - key: 46ef5cb1-2c57-4f22-9de5-a286652ea7e8
        time_period: 7
        title: 
          de: Gesuch um Anhörung erstellen
          fr: Créer une demande d'audition
          it: Creare una richiesta di audizione
        type: document
        optional: true

      links:
      - task_ref: reaktion_bafu_anhoerung

    reaktion_bafu_anhoerung:
      key: 55404db7-1645-4aad-9d8a-50ecbf948bf9
      time_period: 7
      title: 
        de: Reaktion BAFU auf Anhörung
        fr: Réaction de l'OFEV à l'audition
        it: Risposta dell'UFAM alla consultazione
      steps:

      - key: 1d600fb4-b0cc-4254-a07a-c06fe8071a2b
        time_period: 7
        title: 
          de: Reaktion BAFU
          fr: Réaction de l'OFEV
          it: Risposta dell'UFAM
        type: form
        name: reaktion_anhoerung
        fields:
        - name: antrag_bewilligt
          type: str
          choices:
          - label: 
              de: Antrag abgelehnt
              fr: Demande refusée
              it: Domanda respinta
            value: nein
          - label: 
              de: Antrag bewilligt
              fr: Demande approuvée
              it: Applicazione approvata
            value: ja
      links:
      - task_ref: END
        condition: form.reaktion_anhoerung.antrag_bewilligt == `nein`
      - task_ref: zusicherung
        condition: form.reaktion_anhoerung.antrag_bewilligt == `ja`

    zusicherung:
