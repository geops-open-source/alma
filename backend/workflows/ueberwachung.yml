workflow:
  key: f870cb79-3903-4dd8-b289-b26a81938a08
  title:
    de: Überwachung
    fr: Surveillance
    it: Monitoraggio
  version: 1
  start_task_ref: start_ueberwachung
  min_per_entity: 0
  max_per_entity: null
  tasks:
    start_ueberwachung:
      key: 269a3e2c-79d7-4c8c-b873-de3b6a9e4ffe
      title:
        de: Überwachung Pflichtenheft separat?
        fr: Surveillance Cahier des charges séparé?
        it: Monitorare le specifiche separatamente?
      steps:
      - key: ce232d6c-d240-42fb-8ae8-1c5b7a3e01d2
        title:
          de: Separate Einreichung des Pflichtenheftes (Konzept)?
          fr: Soumission séparée du cahier des charges (concept)?
          it: Presentazione separata delle specifiche (concetto)?
        time_period: 7
        type: form
        name: entscheid_konzept_separat
        fields:
        - name: entscheid_konzept_separat_erfasst
          type: str
          choices:
          - label:
              de: Ja, das Konzept wurde / wird separat eingereicht
              fr: Oui, le concept a été / sera soumis séparément
              it: Sì, il concetto è stato / sarà presentato separatamente.
            value: ja
          - label:
              de: Nein, Inhaber reicht direkt Zwischenbericht / Schlussbericht ein
              fr: Non, le propriétaire soumet directement le rapport intermédiaire
                / final
              it: No, il proprietario presenta direttamente il rapporto intermedio/il
                rapporto finale
            value: nein
      - key: 59fcca96-d39b-4341-b398-60c058972fbd
        title:
          de: Inhaber bereits zu Einreichung Bericht aufgefordert? (zum Beispiel bei
            TU)
          fr: Propriétaire déjà invité à soumettre un rapport ? (par exemple pour
            ET)
          it: Il proprietario ha già richiesto di presentare un rapporto? (per esempio
            al IT)
        optional: true
        time_period: 7
        type: form
        name: entscheid_inhaber_bericht
        fields:
        - name: entscheid_inhaber_bericht_erfasst
          type: str
          choices:
          - label:
              de: Inhaber schon früher zur Einreichung Bericht aufgefordert
              fr: Propriétaire déjà invité à soumettre un rapport
              it: Al proprietario è stato precedentemente richiesto di presentare
                una relazione
            value: ja
          - label:
              de: 'neu aufnehmen: Brief mit Aufforderung an Inhaber'
              fr: 'nouvel enregistrement: Lettre d''invitation au propriétaire'
              it: 'nuovo record: Lettera con richiesta al proprietario'
            value: nein
      - key: 6441993a-1b28-474e-9997-859d5bce2833
        title:
          de: Aufforderung an Inhaber
          fr: Demande au propriétaire
          it: Richiesta al proprietario
        optional: true
        time_period: 7
        type: document
      - key: 71d0f5c8-2903-4ab4-8ad3-211177fa066f
        title:
          de: Angeforderter Bericht eingegangen?
          fr: Rapport demandé reçu ?
          it: Ricevuto il rapporto richiesto?
        time_period: 7
        type: form
        name: entscheid_bericht
        fields:
        - name: entscheid_bericht_erfasst
          type: str
          choices:
          - label:
              de: Ja, Bericht innerhalb Frist eingegangen
              fr: Oui, rapport reçu dans les délais
              it: Sì, rapporto ricevuto entro la scadenza
            value: ja
          - label:
              de: nein, nicht innerhalb Frist eingegangen
              fr: non, pas reçu dans les délais
              it: no, non ricevuto entro la scadenza
            value: nein
      links:
      - task_ref: beurteilung_uekonzept
        condition: form.entscheid_bericht.entscheid_bericht_erfasst == `ja`
      - task_ref: mahnung_uekonzept
        condition: form.entscheid_bericht.entscheid_bericht_erfasst == `nein`
      - task_ref: ueberwachung_freigabe
        condition: form.entscheid_konzept_separat.entscheid_konzept_separat_erfasst
          == `ja`
      triggers:
      - type: UntersuchungsStandSetzen
        value: code:10023:08
      start_task: true
      time_period: 7
    mahnung_uekonzept:
      key: fb692695-60e4-465f-8762-a05084743106
      title:
        de: Mahnung zur Einreichung Überwachungskonzept
        fr: Rappel pour la présentation du concept de surveillance
        it: Promemoria per la presentazione del concetto di monitoraggio
      steps:
      - key: a7b9c645-b77f-41a9-8857-d2d57dde93f6
        title:
          de: Mahnung an Inhaber
          fr: Rappel au propriétaire
          it: Promemoria per il proprietario
        optional: true
        time_period: 7
        type: document
      - key: e6a8e6ad-3578-4042-8c44-ece7ab8364ea
        title:
          de: Angeforderter Bericht nach Mahnung eingegangen?
          fr: Rapport demandé reçu après rappel ?
          it: Il rapporto richiesto è stato ricevuto dopo il sollecito?
        time_period: 7
        type: form
        name: entscheid_bericht_mahnung_uekonzept
        fields:
        - name: entscheid_bericht_mahnung_uekonzept_erfasst
          type: str
          choices:
          - label:
              de: ja, Einreichung innerhalb Mahnungsfrist
              fr: oui, dépôt dans le délai de rappel
              it: sì, presentazione entro il periodo di sollecito
            value: ja
          - label:
              de: nein, keine Einreichung innerhalb Mahnungsfrist
              fr: non, pas de dépôt dans le délai de rappel
              it: no, nessuna presentazione entro il periodo di sollecito
            value: nein
      links:
      - task_ref: beurteilung_uekonzept
        condition: form.entscheid_bericht_mahnung_uekonzept.entscheid_bericht_mahnung_uekonzept_erfasst
          == `ja`
      - task_ref: mahnung_uekonzept
        condition: form.entscheid_bericht_mahnung_uekonzept.entscheid_bericht_mahnung_uekonzept_erfasst
          == `nein`
      triggers:
      - type: UntersuchungsStandSetzen
        value: code:10023:08
      time_period: 7
    beurteilung_uekonzept:
      key: b19fb53f-6c49-4029-b98b-791b28646b9d
      title:
        de: Beurteilung Überwachungskonzept
        fr: Évaluation du concept de surveillance
        it: Valutazione del concetto di monitoraggio
      steps:
      - key: e69777df-68a9-45dc-97f4-71cffb9cd17c
        title:
          de: Bericht Inhaber
          fr: Rapport du propriétaire
          it: Proprietario del rapporto
        optional: true
        time_period: 7
        type: document
      - key: a637d80c-b021-49b6-8a57-9b3ea27b2b32
        title:
          de: Ist der eingereichte Bericht unvollständig, sind Nachforderugnen nötig?
          fr: Le rapport soumis est-il incomplet, des demandes supplémentaires sont-elles
            nécessaires?
          it: Se il rapporto presentato è incompleto, sono necessarie ulteriori richieste?
        time_period: 7
        type: form
        name: entscheid_bericht_uekonzept_vollstaendig
        fields:
        - name: entscheid_bericht_uekonzept_vollstaendig_erfasst
          type: str
          choices:
          - label:
              de: Ja, es sind Nachforderungen nötig, Bericht ist unvollständig
              fr: Oui, des demandes supplémentaires sont nécessaires, le rapport est
                incomplet
              it: Sì, sono necessarie ulteriori richieste di risarcimento, il rapporto
                è incompleto
            value: nachforderung
          - label:
              de: Nein, keine Nachforderung, der Bericht ist ok
              fr: Non, pas de demande supplémentaire, le rapport est ok
              it: No, nessun reclamo aggiuntivo, il rapporto è ok
            value: ok
      - key: 3438eadd-bf64-475f-85ad-322e60ada4e7
        title:
          de: Ist der eingereichte Bericht unvollständig, sind Nachforderugnen nötig?
          fr: Le rapport soumis est-il incomplet, des demandes supplémentaires sont-elles
            nécessaires?
          it: Se il rapporto presentato è incompleto, sono necessarie ulteriori richieste?
        optional: true
        time_period: 7
        type: form
        name: entscheid_kontrolle_standortsdaten
        fields:
        - name: entscheid_kontrolle_standortsdaten_erfasst
          type: bool
          label:
            de: 'Kontrolle: Standortdaten aufgrund neuer Erkenntnisse nachgetragen,
              relevante Dokumente aufgenommen?'
            fr: 'Contrôle : données de localisation ajoutées sur la base de nouvelles
              connaissances, documents pertinents inclus?'
            it: 'Verifica: aggiunta di dati sulla posizione in base a nuove scoperte,
              inclusione di documenti rilevanti?'
      links:
      - task_ref: uekonzept_anhoerung_kanton
        condition: form.entscheid_bericht_uekonzept_vollstaendig.entscheid_bericht_uekonzept_vollstaendig_erfasst
          == `ok`
      - task_ref: uekonzept_nachforderung
        condition: form.entscheid_bericht_uekonzept_vollstaendig.entscheid_bericht_uekonzept_vollstaendig_erfasst
          == `nachforderung`
      triggers:
      - type: UntersuchungsStandSetzen
        value: code:10023:08
      time_period: 7
    uekonzept_nachforderung:
      key: ca2b6f96-d01e-40df-b603-9e6e80f61d4f
      title:
        de: Nachforderung Überwachungskonzept
        fr: Demande de concept de surveillance
        it: Richiesta di follow-up per il concetto di monitoraggio
      steps:
      - key: f9bfe081-54df-4319-8987-b536d752b33d
        title:
          de: Aufforderung an Inhaber
          fr: Demande au propriétaire
          it: Richiesta al proprietario
        optional: true
        time_period: 7
        type: document
      - key: b776dae8-7cca-4ce3-b9de-49a6f63e91c0
        title:
          de: Hat der Inhaber die nachgeforderten Unterlagen eingereicht?
          fr: Le propriétaire a-t-il fourni les documents demandés ultérieurement
            ?
          it: Il proprietario ha presentato i documenti richiesti?
        optional: true
        time_period: 7
        type: form
        name: entscheid_nachforderungen_vollstaendig
        fields:
        - name: entscheid_nachforderungen_vollstaendig_erfasst
          type: str
          choices:
          - label:
              de: Ja, die Unterlagen sind jetzt vollständig
              fr: Oui, le dossier est maintenant complet
              it: Sì, i documenti sono ora completi
            value: ja
          - label:
              de: Nein, es fehlen nach wie vor Informationen
              fr: Non, il manque toujours des informations
              it: No, mancano ancora informazioni
            value: nein
          - label:
              de: Der Inhaber hat sich noch nicht gemeldet
              fr: Le propriétaire ne s'est pas encore manifesté
              it: Il proprietario non ci ha ancora contattato
            value: keine
          - label:
              de: Nach Rücksprache mit Inhaber wird auf Nachforderungen verzichtet
              fr: Après concertation avec le propriétaire, il est renoncé à toute
                demande de remboursement
              it: Dopo aver consultato il proprietario, si rinuncia a ulteriori richieste
                di risarcimento
            value: verzicht
      - key: 5cbf18c3-eb15-4a8c-a211-73ce1882814d
        title:
          de: Bericht Inhaber
          fr: Rapport du propriétaire
          it: Proprietario del rapporto
        optional: true
        time_period: 7
        type: document
      - key: 76a9eda0-4594-4803-a4e8-51ab07fba2b1
        title:
          de: Beurteilung abgeschlossen?
          fr: Évaluation terminée?
          it: Valutazione completata?
        optional: true
        time_period: 7
        type: form
        name: entscheid_nachforderungen_abschluss
        fields:
        - name: entscheid_nachforderungen_abschluss_erfasst
          type: bool
          label:
            de: 'Kontrolle: Standortdaten aufgrund neuer Erkenntnisse nachgetragen,
              relevante Dokumente aufgenommen?'
            fr: 'Contrôle : données de localisation ajoutées sur la base de nouvelles
              connaissances, documents pertinents inclus?'
            it: 'Verifica: aggiunta di dati sulla posizione in base a nuove scoperte,
              inclusione di documenti rilevanti?'
      links:
      - task_ref: mahnung_uekonzept
        condition: form.entscheid_nachforderungen_vollstaendig.entscheid_nachforderungen_vollstaendig_erfasst
          == `keine`
      - task_ref: uekonzept_nachforderung
        condition: form.entscheid_nachforderungen_vollstaendig.entscheid_nachforderungen_vollstaendig_erfasst
          == `nein`
      - task_ref: uekonzept_anhoerung_kanton
        condition: form.entscheid_nachforderungen_vollstaendig.entscheid_nachforderungen_vollstaendig_erfasst
          == `ja` || form.entscheid_nachforderungen_vollstaendig.entscheid_nachforderungen_vollstaendig_erfasst
          == `verzicht'
      triggers:
      - type: UntersuchungsStandSetzen
        value: code:10023:08
      time_period: 7
    uekonzept_anhoerung_kanton:
      key: d7669ed9-2fb3-4ecf-b7cb-c0871a1adb1e
      title:
        de: Überwachungskonzept Anhörung Kanton
        fr: Concept de surveillance Audition du canton
        it: Concetto di monitoraggio Consultazione cantonale
      steps:
      - key: ae06cec7-ebf1-41a9-8e0c-d29e9c3800be
        title:
          de: Begleitbrief Anhörung
          fr: Lettre d'accompagnement audition
          it: Lettera di presentazione Audizione
        optional: true
        time_period: 7
        type: document
      - key: cc74b548-e388-45d0-bc52-5103f76717d2
        title:
          de: Stellungnahme abwarten
          fr: Attendre la prise de position
          it: Attendere la dichiarazione
        optional: true
        time_period: 7
        type: form
        name: entscheid_stellungnahme_uekonzept
        fields:
        - name: entscheid_stellungnahme_uekonzept_erfasst
          type: str
          choices:
          - label:
              de: Stellungnahme innerhalb Frist eingetroffen
              fr: Prise de position reçue dans les délais
              it: Dichiarazione ricevuta entro la scadenza
            value: ja
          - label:
              de: keine Stellungnahme innerhalb Frist eingetroffen
              fr: aucune prise de position n'a été reçue dans les délais
              it: Nessuna dichiarazione ricevuta entro la scadenza
            value: nein
      links:
      - task_ref: stellungnahme_uekonzept
        condition: form.entscheid_stellungnahme_uekonzept.entscheid_stellungnahme_uekonzept_erfasst
          == `ja`
      - task_ref: uekonzept_anhoerung_inhaber
        condition: form.entscheid_stellungnahme_uekonzept.entscheid_stellungnahme_uekonzept_erfasst
          == `nein`
      triggers:
      - type: UntersuchungsStandSetzen
        value: code:10023:08
      time_period: 7
    stellungnahme_uekonzept:
      key: fde376f0-90d6-43bd-a3e4-29d811f6f9eb
      title:
        de: Reaktion Anhörung Kanton
        fr: Réaction audition canton
        it: Risposta alla consultazione cantonale
      steps:
      - key: 6b6ceb1d-db79-4f51-9699-13bcd0582357
        title:
          de: Stellungnahme Kanton
          fr: Prise de position du canton
          it: Dichiarazione cantonale
        optional: true
        time_period: 7
        type: document
      - key: 1de112fc-8cad-4538-9942-f1b12e7b0348
        title:
          de: Einfluss Stellungnahme Kanton zum Überwachungskonzept
          fr: Influence de la prise de position du canton sur le concept de surveillance
          it: Influenza della dichiarazione del Cantone sul concetto di monitoraggio
        optional: true
        time_period: 7
        type: form
        name: entscheid_einfluss_stellungnahme_uekonzept
        fields:
        - name: entscheid_einfluss_stellungnahme_uekonzept_erfasst
          type: str
          choices:
          - label:
              de: Neubeurteilung gemäss Antrag
              fr: Réévaluation selon la demande
              it: Rivalutazione in base all'applicazione
            value: neubeurteilung
          - label:
              de: keine Neubeurteilung; Antrag nicht berücksichtigt
              fr: pas de réévaluation ; demande non prise en compte
              it: Nessuna rivalutazione; domanda non presa in considerazione
            value: keine
          - label:
              de: Immer noch keine Neubeurteilung, Antrag definitiv abgewiesen
              fr: Toujours pas de réévaluation, demande définitivement rejetée
              it: Ancora nessuna rivalutazione, domanda definitivamente respinta
            value: abgelehnt
          - label:
              de: einverstanden oder keine Antwort, keine Anpassung nötig
              fr: d'accord ou pas de réponse, pas d'adaptation nécessaire
              it: risposta affermativa o negativa, non è necessario alcun adeguamento
            value: einverstanden
      - key: f422dbba-349a-409c-96f3-c7e0dc97665d
        title:
          de: Rückmeldung auf Stellungnahme
          fr: Réponse à la prise de position
          it: Risposta alla dichiarazione
        optional: true
        time_period: 7
        type: document
      - key: 24870514-325b-4af1-be55-7c45ab0f47c1
        title:
          de: Dokumentenaufnahme
          fr: Enregistrement des documents
          it: Registrazione dei documenti
        time_period: 7
        type: form
        name: entscheid_dokumente_uekonzept_stellungnahme
        fields:
        - name: entscheid_dokumente_uekonzept_stellungnahme_erfasst
          type: str
          choices:
          - label:
              de: 'Kontrolle: (Alle)Dokument(e) sind vollständig und korrekt aufgenommen
                (Autor nicht vergessen!)'
              fr: 'Contrôle: le(s) document(s) est/sont complet(s) et correctement
                enregistré(s) (ne pas oublier l''auteur !)'
              it: 'Controllo: (Tutti) i documenti sono completi e registrati correttamente
                (non dimenticare l''autore!)'
            value: ja
      links:
      - task_ref: beurteilung_uekonzept
        condition: form.entscheid_dokumente_uekonzept_stellungnahme.entscheid_dokumente_uekonzept_stellungnahme_erfasst
          == `neubeurteilung`
      - task_ref: stellungnahme_uekonzept
        condition: form.entscheid_dokumente_uekonzept_stellungnahme.entscheid_dokumente_uekonzept_stellungnahme_erfasst
          == `keine`
      - task_ref: uekonzept_anhoerung_inhaber
        condition: form.entscheid_dokumente_uekonzept_stellungnahme.entscheid_dokumente_uekonzept_stellungnahme_erfasst
          == `abgelehnt` || form.entscheid_dokumente_uekonzept_stellungnahme.entscheid_dokumente_uekonzept_stellungnahme_erfasst
          == `einverstanden`
      triggers:
      - type: UntersuchungsStandSetzen
        value: code:10023:08
      time_period: 7
    uekonzept_anhoerung_inhaber:
      key: b9fe719a-9f27-4ba6-87c7-fc0d2b000c9b
      title:
        de: Überwachungskonzept Anhörung Inhaber
        fr: Concept de surveillance Audition du propriétaire
        it: Concetto di monitoraggio Consultazione con il proprietario
      steps:
      - key: d0646e31-3c22-4047-bb9f-eee1b1b0c8c4
        title:
          de: Stellungnahme definitiv
          fr: Prise de position définitive
          it: Dichiarazione definitiva
        optional: true
        time_period: 7
        type: document
      - key: 6adb2127-4d46-4141-ba15-21c1aaba35c1
        title:
          de: Stellungnahme abwarten
          fr: Attendre la prise de position
          it: Attendere la dichiarazione
        time_period: 7
        type: form
        name: entscheid_stellungnahme_uekonzept_inhaber
        fields:
        - name: entscheid_stellungnahme_uekonzept_inhaber_erfasst
          type: str
          choices:
          - label:
              de: Stellungnahme innerhalb Frist eingetroffen
              fr: Prise de position reçue dans les délais
              it: Dichiarazione ricevuta entro la scadenza
            value: ja
          - label:
              de: keine Stellungnahme innerhalb Frist eingetroffen
              fr: aucune prise de position n'a été reçue dans les délais
              it: Nessuna dichiarazione ricevuta entro la scadenza
            value: nein
      links:
      - task_ref: stellungnahme_uekonzept_inhaber
        condition: form.entscheid_stellungnahme_uekonzept_inhaber.entscheid_stellungnahme_uekonzept_inhaber_erfasst
          == `ja`
      - task_ref: ueberwachung_freigabe
        condition: form.entscheid_stellungnahme_uekonzept_inhaber.entscheid_stellungnahme_uekonzept_inhaber_erfasst
          == `nein`
      triggers:
      - type: UntersuchungsStandSetzen
        value: code:10023:08
      time_period: 7
    stellungnahme_uekonzept_inhaber:
      key: 1b346184-30d5-43e9-97bf-11577fd59a1a
      title:
        de: Reaktion Inhaber
        fr: Réaction du propriétaire
        it: Risposta del proprietario
      steps:
      - key: 12b5bee1-2fe2-4494-a638-3e9a029514a9
        title:
          de: Stellungnahme Inhaber
          fr: Prise de position du propriétaire
          it: Proprietario della dichiarazione
        optional: true
        time_period: 7
        type: document
      - key: cbf84408-f7ec-4a84-81c4-12f82e8e8da9
        title:
          de: Einfluss Stellungnahme Inhaber zum Überwachungskonzept
          fr: Influence Prise de position du propriétaire sur le concept de surveillance
          it: Influenza Dichiarazione del proprietario sul concetto di monitoraggio
        optional: true
        time_period: 7
        type: form
        name: entscheid_einfluss_stellungnahme_inhaber_uekonzept
        fields:
        - name: entscheid_einfluss_stellungnahme_inhaber_uekonzept_erfasst
          type: str
          choices:
          - label:
              de: Neubeurteilung gemäss Antrag
              fr: Réévaluation selon la demande
              it: Rivalutazione in base all'applicazione
            value: neubeurteilung
          - label:
              de: keine Neubeurteilung; Antrag nicht berücksichtigt
              fr: pas de réévaluation ; demande non prise en compte
              it: Nessuna rivalutazione; domanda non presa in considerazione
            value: keine
          - label:
              de: Immer noch keine Neubeurteilung, Antrag definitiv abgewiesen
              fr: Toujours pas de réévaluation, demande définitivement rejetée
              it: Ancora nessuna rivalutazione, domanda definitivamente respinta
            value: abgelehnt
          - label:
              de: einverstanden oder keine Antwort, keine Anpassung nötig
              fr: d'accord ou pas de réponse, pas d'adaptation nécessaire
              it: risposta affermativa o negativa, non è necessario alcun adeguamento
            value: einverstanden
      - key: fc065702-f504-4b5b-bf6f-c8b56ec882ba
