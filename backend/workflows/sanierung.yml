    du_pflichtenheft_anhoerung_inhaber:
      key: ef1a705b-9bc3-4f23-9be5-b6c735cfb595
      title:
        de: DU Pflichtenheft - Anhörung Inhaber
        fr: ED Cahier des charges - Audition du propriétaire
        it: Specifiche ID - consultazione con il proprietario
      steps:
      - key: 4a1fcfee-55f5-4afb-baf2-c1c497a2e606
        title:
          de: Brief - Stellungnahme definitiv
          fr: Lettre - Prise de position définitive
          it: Lettera - dichiarazione definitiva
        optional: true
        time_period: 7
        type: document
      - key: c303dcd1-781c-4a8f-b0de-30c831c11eb3
        title:
          de: Eingang Stellungnahme abwarten
          fr: Attendre la réception de la prise de position
          it: Attendere il ricevimento della dichiarazione
        time_period: 7
        type: form
        name: eingang_stellungnahme
        fields:
        - name: anhoerung_stellungnahme_eingetroffen
          type: str
          choices:
          - label:
              de: Keine Stellungnahme innerhalb Frist
              fr: Pas de prise de position dans les délais
              it: Nessuna dichiarazione entro la scadenza
            value: nein
          - label:
              de: Stellungnahme innerhalb Frist eingetroffen
              fr: Prise de position reçue dans les délais
              it: Dichiarazione ricevuta entro la scadenza
            value: ja
      - key: ca522058-7d49-400e-9cb0-9984df39fe1a
        title:
          de: Stellungnahme Inhaber
          fr: Prise de position du propriétaire
          it: Proprietario della dichiarazione
        condition: form.eingang_stellungnahme.anhoerung_stellungnahme_eingetroffen
          == `ja`
        optional: true
        time_period: 7
        type: document
      - key: 2a8f32e0-da66-4ddb-a96f-3eeedee417e6
        title:
          de: Einfluss Stellungnahme
          fr: Influence Prise de position
          it: Dichiarazione di influenza
        condition: form.eingang_stellungnahme.anhoerung_stellungnahme_eingetroffen
          == `ja`
        optional: true
        time_period: 7
        type: form
        name: du_pflichtenheft_anhoerung_inhaber__einfluss_stellungnahme
        fields:
        - name: neubeurteilung
          type: str
          choices:
          - label:
              de: Neubeurteilung
              fr: Réévaluation
              it: Rivalutazione
            value: ja
          - label:
              de: Keine Neubeurteilung, Stellungnahme nicht berücksichtigt
              fr: Pas de réévaluation, avis non pris en compte
              it: Nessuna rivalutazione, opinione non presa in considerazione
            value: nein
          - label:
              de: Immer noch keine Neubeurteilung, Antrag definitiv abgewiesen
              fr: Toujours pas de réévaluation, demande définitivement rejetée
              it: Ancora nessuna rivalutazione, domanda definitivamente respinta
            value: nein_abgewiesen
          - label:
              de: Einverstanden oder keine Antwort, keine Rückmeldung
              fr: D'accord ou pas de réponse, pas de réponse
              it: D'accordo o nessuna risposta, nessun feedback
            value: nein_rueckmeldung
      - key: 243417e5-327c-454c-80a5-38fce8203da5
        title:
          de: Rückmeldung auf Stellungnahme
          fr: Réponse à la prise de position
          it: Feedback sulla dichiarazione
        condition: form.eingang_stellungnahme.anhoerung_stellungnahme_eingetroffen
          == `ja`
        optional: true
        time_period: 7
        type: document
      - key: 51ec80c8-6eb4-483d-ac92-c9290968e271
        title:
          de: Dokumentaufnahme
          fr: Enregistrement du document
          it: Registrazione dei documenti
        condition: form.eingang_stellungnahme.anhoerung_stellungnahme_eingetroffen
          == `ja`
        optional: true
        time_period: 7
        type: form
        name: dokumentenaufnahme
        fields:
        - name: dokumentenaufnahme_korrekt
          type: bool
          label:
            de: Kontrolle - Dokumentaufnahme korrekt (Autor nicht vergessen!)
            fr: Contrôle - Prise de document correcte (ne pas oublier l'auteur!)
            it: Controllo - la registrazione del documento è corretta (non dimenticare
              l'autore!)
      links:
      - task_ref: detailuntersuchung_freigabe_durch
