        type: form
        name: abschluss_untersuchungsstufe
        fields:
        - name: phase_abgeschlossen
          type: bool
          label:
            de: Phase abgeschlossen
            fr: Phase terminée
            it: Fase completata
      links:
      - task_ref: detailuntersuchung_schlussbericht
      triggers:
      - type: UntersuchungsStandSetzen
        value: code:10023:06
      time_period: 7
    detailuntersuchung_schlussbericht:
      key: 9fc4fdf2-5ab2-49a8-80cd-adfd2a7cd7cc
      title:
        de: Detailuntersuchung Schlussbericht
        fr: Enquête détaillée Rapport final
        it: Indagine dettagliata Relazione finale
      steps:
      - key: 54a09a16-382e-414c-a0ee-d6fbc45ec122
        title:
          de: Aufforderung zur Einreichung
          fr: Appel à propositions
          it: Invito a presentare
        optional: true
        time_period: 7
        type: form
        name: inhaber_aufforderung_einreichung
        fields:
        - name: einhaber_aufgefordert
          type: str
          choices:
          - label:
              de: Ja, der Inhaber wurde bereits zur Einreichung aufgefordert
