                domanda.
            value: nein
      - key: 46cbaaab-c41f-4a56-80cc-b2ee0257f223
        title:
          de: Brief - Aufforderung zur Einreichung Bericht
          fr: Lettre - Invitation à soumettre un rapport
          it: Lettera - Richiesta di presentazione del rapporto
        optional: true
        time_period: 7
        type: document
      - key: 080b727c-9895-415d-8e0e-a60567fa7510
        title:
          de: Einreichen Bericht durch Inhaber
          fr: Soumission du rapport par le propriétaire
          it: Presentazione del rapporto da parte del proprietario
        time_period: 7
        type: form
        name: detailuntersuchung_schlussbericht__einreichen_brief
        fields:
        - name: bericht_eingereicht
          type: str
          choices:
          - label:
              de: Der Bericht wurde fristgerecht eingereicht
              fr: Le rapport a été remis dans les délais
              it: Il rapporto è stato presentato in tempo
            value: ja
          - label:
              de: Keine fristgerechte Einreichung des Berichtes
              fr: Pas de soumission de rapport dans les délais
              it: Mancata presentazione tempestiva del rapporto
            value: nein
      links:
      - task_ref: detailuntersuchung_schlussbericht_beurteilung
        condition: form.detailuntersuchung_schlussbericht__einreichen_brief.bericht_eingereicht
          == `ja`
      - task_ref: detailuntersuchung_schlussbericht_mahnung
        condition: form.detailuntersuchung_schlussbericht__einreichen_brief.bericht_eingereicht
          == `nein`
      triggers:
      - type: UntersuchungsStandSetzen
        value: code:10023:06
      time_period: 7
    detailuntersuchung_schlussbericht_beurteilung:
      key: a679ccde-5c00-48b8-87ae-6e5f704d054d
      title:
        de: Detailuntersuchung Schlussbericht - Beurteilung
        fr: Enquête détaillée Rapport final - évaluation
        it: Indagine dettagliata Relazione finale - Valutazione
      steps:
      - key: 2166b2bf-ba61-40fb-8a4d-0554a00d1d25
        title:
          de: Bericht Inhaber
          fr: Rapport du propriétaire
          it: Proprietario del rapporto
        optional: true
        time_period: 7
        type: document
      - key: 36c9c083-ccc3-4ed3-8bcc-d0f55e45b23d
        title:
          de: Relevante Stellungnahme Kanton?
          fr: Prise de position pertinente du canton?
          it: Dichiarazione cantonale pertinente?
        optional: true
        time_period: 7
        type: form
        name: detailuntersuchung_schlussbericht_beurteilung__stellungnahme_kanton
        fields:
        - name: detailuntersuchung_schlussbericht_beurteilung__relevanz_stellungnahme_kanton
          type: str
          choices:
          - label:
              de: Ja, Stellungnahme Kanton fliesst in Beurteilung mit ein
              fr: Oui, prise de position du canton prise en compte dans l'évaluation
              it: Sì, il parere del Cantone è incluso nella valutazione.
            value: ja
          - label:
              de: Stellungnahme Kanton ist nicht relevant
              fr: La prise de position du canton n'est pas pertinente
              it: Il parere del Cantone non è rilevante
            value: nein
          - label:
              de: Der Kanton hat nicht Stellung genommen
              fr: Le canton n'a pas pris position
              it: Il Cantone non ha preso posizione
            value: keine_angabe
      - key: f785abc4-dc38-44d3-9504-c7a62d5d62a6
        title:
          de: Stellungnahme Kanton
          fr: Prise de position du canton
          it: Dichiarazione cantonale
        optional: true
        time_period: 7
        type: document
      - key: e39a7f42-a81b-4705-b179-62ecd8bb41b2
        title:
          de: Beurteilung abgeschlossen?
          fr: Évaluation terminée?
          it: Valutazione completata?
        optional: true
        time_period: 7
        type: form
        name: abschluss_beurteilung
        fields:
        - name: beurteilung_abgeschlossen
          type: bool
          label:
            de: Die Beurteilung des Berichtes und die Anpassung der Standortdaten
              ist abgeschlossen
            fr: L'évaluation du rapport et l'adaptation des données de site sont terminées
            it: La valutazione del rapporto e l'adeguamento dei dati relativi all'ubicazione
              del sito sono stati completati. dati del sito è stata completata
      - key: 07769378-300f-47fe-b836-040536f751c8
        title:
          de: Neubeurteilung Standort nötig
          fr: Réévaluation du site nécessaire
          it: È necessario rivalutare la posizione
        time_period: 7
        type: form
        name: neubeurteilung
        fields:
        - name: neubeurteilung_noetig
          type: str
          choices:
          - label:
              de: Ja, Abbruch Sanierungsprojekt (Anlage Geschäft IHO manuell!!)
              fr: Oui, abandon du projet d'assainissement (Annexe activité OVP manuelle
                !!)
              it: Sì, abbattimento del progetto di ristrutturazione (allegato manuale
                OP business!!!)
            value: ja
          - label:
              de: Nein, Sanierung wird fortgeführt
              fr: Non, la rénovation se poursuit
              it: No, la ristrutturazione continuerà
            value: nein
      - key: e8392919-606c-4b4e-95d2-563161ff8bda
        title:
          de: Ergänzende Detailuntersuchung
          fr: Examen détaillé complémentaire
          it: Indagine dettagliata supplementare
        optional: true
        time_period: 7
        type: form
        name: ergaenzende_untersuchungen
        fields:
        - name: ergaenzende_untersuchungen_noetig
          type: str
          choices:
          - label:
              de: Ja
              fr: Oui
              it: Sí
            value: ja
          - label:
              de: Nein
              fr: Non
              it: 'No'
            value: nein
      links:
      - task_ref: END
        condition: form.neubeurteilung.neubeurteilung_noetig == `ja`
      - task_ref: start_ergaenzende_du
      - task_ref: sanierung_start_sanierungsprojekt
      time_period: 7
    du_pflichtenheft_mahnung:
      key: 692c4cdf-d73e-4b74-a15b-14b90b942090
      title:
        de: DU Pflichtenheft - Mahnung zur Einreichung
        fr: ED Cahier des charges - Rappel de dépôt
        it: Specifiche ID - promemoria per la presentazione
      steps:
      - key: 4cb16c07-241f-498d-b44d-e8a35cf93766
        title:
          de: Brief - Mahnung an Inhaber
          fr: Lettre - rappel aux titulaires
          it: Lettera - sollecito al proprietario
        optional: true
        time_period: 7
        type: document
      - key: 8bd8b480-ab4d-4c9a-be98-a60a7127f6c6
        title:
          de: Reaktion Inhaber auf Mahnung
          fr: Réaction du propriétaire au rappel
          it: Risposta del proprietario al sollecito
        time_period: 7
        type: form
        name: reaktion_inhaber_mahnung
        fields:
        - name: bericht_mittlerweile_eingereicht
          type: str
          choices:
          - label:
              de: Ja, der verlangte Bericht wurde eingereicht
              fr: Oui, le rapport demandé a été remis
              it: Sì, il rapporto richiesto è stato presentato
            value: ja
          - label:
              de: Nein, der verlangte Bericht wurde noch immer nicht eingereicht
              fr: Non, le rapport demandé n'a toujours pas été remis.
              it: No, il rapporto richiesto non è ancora stato presentato.
            value: nein
      links:
      - task_ref: du_pflichtenheft_beurteilung
        condition: form.reaktion_inhaber_mahnung.bericht_mittlerweile_eingereicht
          == `ja`
      - task_ref: du_pflichtenheft_mahnung
        condition: form.reaktion_inhaber_mahnung.bericht_mittlerweile_eingereicht
          == `nein`
      triggers:
      - type: UntersuchungsStandSetzen
        value: code:10023:06
      time_period: 7
    du_pflichtenheft_beurteilung:
      key: 978bd32e-ca37-4021-bf95-fdf9568e206e
      title:
