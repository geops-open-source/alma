      - key: a31f8e7e-7254-4267-89a7-35513d23ea96
        title:
          de: Beurteilung Versand - Brief vollständig?
          fr: Evaluation de l'envoi - lettre complète ?
          it: Valutazione spedizione - lettera completa?
        optional: true
        time_period: 7
        type: form
        name: beurteilung_versand
        fields:
        - name: brief_vollstaendig
