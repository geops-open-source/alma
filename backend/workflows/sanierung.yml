      - key: cb00f387-9594-4fe6-a345-ee12e9c8fe37
        title:
          de: Pflichtenheft Inhaber
          fr: Cahier des charges du propriétaire
          it: Specifiche del proprietario
        optional: true
        time_period: 7
        type: document
      - key: 56c10891-90e8-4916-a64d-70ccd9e41d1e
        title:
          de: Relevante Stellungnahme Kanton?
          fr: Prise de position pertinente du canton?
          it: Dichiarazione cantonale pertinente?
        optional: true
        time_period: 7
        type: form
        name: du_pflichtenheft_beurteilung_stellungnahme_kanton
        fields:
        - name: du_pflichtenheft_beurteilung__relevanz_stellungnahme_kanton
          type: str
          choices:
          - label:
              de: Ja, Stellungnahme Kanton fliesst in Beurteilung mit ein
              fr: Oui, prise de position du canton prise en compte dans l'évaluation
              it: Sì, il parere del Cantone è incluso nella valutazione.
            value: ja
          - label:
