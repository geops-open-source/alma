workflow:
  key: 0476a40a-4412-4561-b894-dcf181ccd302
  title:
    de: Sanierung
    fr: Rénovation
    it: Ristrutturazione
  version: 1
  start_task_ref: start_sanierung
  min_per_entity: 0
  max_per_entity: null
  tasks:
    start_sanierung:
      key: 0d5297f3-6471-4318-83d4-7f30e4795d5e
      title:
        de: Start Sanierung
        fr: Début de la rénovation
        it: Avvio della ristrutturazione
      steps:
      - key: 12f5625a-a565-4e9b-bf8e-2ea8dfcf00c3
        title:
          de: Zusätzliche Untersuchungen?
          fr: Examens supplémentaires?
          it: Esami supplementari?
        time_period: 7
        type: form
        name: zusatz_untersuchungen
        fields:
        - name: zusatz_untersuchungen_noetig
          type: str
          choices:
          - label:
              de: Ja, es braucht eine Detailuntersuchung
              fr: Oui, il faut une enquête détaillée
              it: Sì, è necessaria un'indagine dettagliata
            value: ja
          - label:
              de: Nein, aber Schlussbericht zur DU fehlt noch (Variantenstudien)
              fr: Non, mais le rapport final sur le ED manque encore (études de variantes)
              it: No, ma manca ancora il rapporto finale sul ID (studi di variante)
            value: varianten
          - label:
              de: Nein, es kann direkt das Sanierungsprojekt (Bauprojekt) starten
              fr: Non, le projet de rénovation (projet de construction) peut être
                lancé directement.
              it: No, il progetto di ristrutturazione (progetto di costruzione) può
                iniziare direttamente
            value: nein
      - key: abddbf01-fd28-4a36-8884-f7ea11c827ad
        title:
          de: Aufforderung zur Einreichung
          fr: Appel à propositions
          it: Invito a presentare
        optional: true
        time_period: 7
        type: form
        name: aufforderung_einreichung
        fields:
        - name: inhaber_aufgefordert
          type: str
          choices:
          - label:
              de: Ja, der Inhaber wurde bereits zur Einreichung aufgefordert
              fr: Oui, le propriétaire a déjà été invité à déposer une demande.
              it: Sì, il proprietario è già stato invitato a presentare
            value: ja
          - label:
              de: Nein, Inhaber wurde noch nicht zur Einreichung aufgefordert
              fr: Non, le propriétaire n'a pas encore été invité à déposer une demande.
              it: No, il proprietario non è ancora stato invitato a presentare la
                domanda.
            value: nein
      - key: ee6a641d-a1f4-4d93-b64f-0abbac49f43e
        title:
          de: Pflichtenheft vorhanden?
          fr: Cahier des charges disponible?
          it: Sono disponibili le specifiche?
        time_period: 7
        type: form
        name: pflichtenheft
        fields:
        - name: pflichtenheft_noetig
          type: str
          choices:
          - label:
              de: Das Vorgehen steht bereits fest, kein Pflichtenheft nötig
              fr: La procédure est déjà définie, pas besoin de cahier des charges
              it: La procedura è già fissata, non sono necessarie specifiche
            value: nein
          - label:
              de: Das Pflichtenheft muss noch eingereicht werden
              fr: Le cahier des charges doit encore être soumis
              it: Le specifiche devono ancora essere presentate
            value: ja
      - key: b6e9763f-ccc4-45df-b3f1-531154498a4c
        title:
          de: Einreichen Bericht durch Inhaber
          fr: Soumission du rapport par le propriétaire
          it: Presentazione del rapporto da parte del proprietario
        time_period: 7
        type: form
        name: start_sanierung__einreichen_brief
        fields:
        - name: bericht_eingereicht
          type: str
          choices:
          - label:
              de: Der Bericht wurde fristgerecht eingereicht
              fr: Le rapport a été remis dans les délais
              it: Il rapporto è stato presentato in tempo
            value: ja
          - label:
              de: Keine fristgerechte Einreichung des Berichtes
              fr: Pas de soumission de rapport dans les délais
              it: Mancata presentazione tempestiva del rapporto
            value: nein
      links:
      - task_ref: detailuntersuchung_laeuft
        condition: form.pflichtenheft.pflichtenheft_noetig == `nein`
      - task_ref: du_pflichtenheft_mahnung
        condition: form.start_sanierung__einreichen_brief.bericht_eingereicht == `nein`
      - task_ref: detailuntersuchung_schlussbericht
        condition: form.zusatz_untersuchungen.zusatz_untersuchungen_noetig == `varianten`
      - task_ref: sanierung_start_sanierungsprojekt
        condition: form.zusatz_untersuchungen.zusatz_untersuchungen_noetig == `nein`
      - task_ref: du_pflichtenheft_beurteilung
        condition: form.start_sanierung__einreichen_brief.bericht_eingereicht == `ja`
      triggers:
      - type: UntersuchungsStandSetzen
        value: code:10023:06
      start_task: true
      time_period: 7
    detailuntersuchung_laeuft:
      key: ae0ed187-f248-4793-9186-0779b81ae12f
      title:
        de: Detailuntersuchung läuft
        fr: Enquête détaillée en cours
        it: Indagine dettagliata in corso
      steps:
      - key: 84b60814-23d2-4db4-9eb4-29f3a3ae5ba7
        title:
