          type: str
          choices:
          - label: 
              de: Keine Beschwerde
              fr: Pas de plainte
              it: Nessun reclamo
            value: nein
          - label: 
              de: Beschwerde eingegangen
              fr: Plainte reçue
              it: Reclamo ricevuto
            value: ja
      links:
      - task_ref: abschliessen
        condition: form.beschwerde_eingegangen.beschwerde_eingegangen == `nein`
      - task_ref: bearbeiten
        condition: form.beschwerde_eingegangen.beschwerde_eingegangen == `ja`
