          it: Ufficio dichiarazioni su Titolare della dichiarazione
        type: document
        optional: true
      links:
      - task_ref: ergaenzung_hu
        condition: form.entscheid_einfluss_stellungnahme_inhaber_hu.entscheid_einfluss_stellungnahme_inhaber_hu_erfasst
          == `einverstanden` || form.entscheid_einfluss_stellungnahme_inhaber_hu.entscheid_einfluss_stellungnahme_inhaber_hu_erfasst
          == 'keine'
      - task_ref: stellungnahme_anhoerung_inhaber_hu
        condition: form.entscheid_einfluss_stellungnahme_inhaber_hu.entscheid_einfluss_stellungnahme_inhaber_hu_erfasst
