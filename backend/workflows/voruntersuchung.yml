        - name: entscheid_einfluss_stellungnahme_inhaber_hu_erfasst
          type: str
          choices:
          - label: 
              de: Antrag angenommen, Neubeurteilung
              fr: Demande acceptée, réévaluation
              it: Domanda accettata, rivalutazione
            value: neubeurteilung
          - label: 
              de: keine Neubeurteilung
              fr: pas de réévaluation
              it: Nessuna rivalutazione
            value: keine
          - label: 
              de: Noch immer keine Neubeurteilung, Antrag definitiv abgelehnt
              fr: Toujours pas de réévaluation, demande définitivement rejetée
              it: Ancora nessuna rivalutazione, domanda definitivamente respinta
            value: abgelehnt
          - label: 
              de: einverstanden oder keine Antwort, keine Anpassung nötig
              fr: d'accord ou pas de réponse, pas d'adaptation nécessaire
              it: Risposta affermativa o negativa, non è necessario alcun adeguamento
            value: einverstanden
