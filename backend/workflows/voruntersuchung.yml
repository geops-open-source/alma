workflow:
  key: c5cfcd93-5d44-488a-8e79-a41721b1e352
  title: 
    de: Voruntersuchung
    fr: Enquête préliminaire
    it: Esame preliminare
  version: 1
  time_period: 365
  start_task_ref: start_hu
  min_per_entity: 0
  max_per_entity: null
  tasks:
    start_hu:
      key: 188760b8-ac0c-4b53-99ce-9c5dc6badc74
      time_period: 7
      title: 
        de: Einreichung Bericht HU
        fr: Soumission du rapport EP
        it: Presentazione del rapporto EP
      steps:
      - key: 452b6bb2-d56f-4ee6-ac22-5d8cc1d82404
        time_period: 7
        title: 
          de: Wurde der Inhaber zur Einreichung eines Berichtes aufgefordert?
          fr: Le propriétaire a-t-il été invité à soumettre un rapport ?
          it: Al proprietario è stato chiesto di presentare una relazione?
        type: form
        name: entscheid_aufforderung_hu
        fields:
        - name: entscheid_aufforderung_hu_erfasst
          type: str
          choices:
          - label: 
              de: Der Inhaber aufgefordert
              fr: Le propriétaire a été invité à
              it: Il proprietario ha richiesto
            value: ja
          - label: 
              de: Nein, der Inhaber hat den Bericht ohne Aufforderung eingereicht
              fr: Non, le propriétaire a soumis le rapport sans y être invité
              it: No, il proprietario ha presentato il rapporto senza che gli venisse richiesto
            value: nein
        optional: true
      - key: 8ead7e21-884b-45c0-881a-055a084a9334
        time_period: 7
        title: 
          de: Aufforderung Voruntersuchung
          fr: Invitation à une enquête préliminaire
          it: Richiesta di esame preliminare
        type: document
        optional: true
      - key: f2eef5c7-acbb-4ca0-b198-33711cad81b9
        title: 
          de: Bericht eingegangen?
          fr: Rapport reçu?
          it: Rapporto ricevuto?
        time_period: 95
        type: form
        name: entscheid_bericht_hu
        fields:
        - name: entscheid_bericht_hu_erfasst
          type: str
          choices:
          - label: 
              de: ja, innerhalb Frist eingegangen / Bericht eingegangen ohne Frist
              fr: oui, reçu dans le délai / rapport reçu sans délai
              it: sì, ricevuto entro la scadenza / rapporto ricevuto senza scadenza
            value: ja
          - label: 
              de: nein, nicht innerhalb Frist eingegangen
              fr: non, pas reçu dans les délais
              it: no, non ricevuto entro la scadenza
            value: nein
      links:
      - task_ref: beurteilung_hu
        condition: form.entscheid_bericht_hu.entscheid_bericht_hu_erfasst == `ja`
      - task_ref: mahnung_bericht_hu
        condition: form.entscheid_bericht_hu.entscheid_bericht_hu_erfasst == `nein`
      triggers:
      - type: UntersuchungsStandSetzen
        value: code:10023:02
      start_task: true
    mahnung_bericht_hu:
      key: c862f19c-85fd-481e-97cb-848a9c2a1459
      time_period: 7
      title: 
        de: Mahnung zur Einreichung Bericht
        fr: Rappel pour la remise du rapport
        it: Promemoria per la presentazione del rapporto
      steps:
      - key: 2d31cc69-95e8-4c91-b237-590c0a48b792
        time_period: 7
        title: 
          de: Mahnung an Inhaber
          fr: Rappel au propriétaire
          it: Promemoria per il proprietario
        type: document
        optional: true
      - key: 1432eb27-c27d-4f50-97e6-fc693cedba8c
        title: 
          de: Einreichung des Berichts nach Mahnung
          fr: Remise du rapport après rappel
          it: Presentazione del rapporto dopo il sollecito
        time_period: 95
        type: form
        name: entscheid_bericht_hu_mahnung
        fields:
        - name: entscheid_bericht_hu_mahnung_erfasst
          type: str
          choices:
          - label: 
              de: ja, innerhalb Mahnungsfrist eingegangen
              fr: oui, reçu dans le délai de rappel
              it: sì, ricevuto entro il periodo di sollecito
            value: ja
          - label: 
              de: nein, neue Mahnung notwendig
              fr: non, nouveau rappel nécessaire
              it: no, è necessario un nuovo promemoria
            value: nein
      links:
      - task_ref: beurteilung_hu
        condition: form.entscheid_bericht_hu_mahnung.entscheid_bericht_hu_mahnung_erfasst
          == `ja`
      - task_ref: mahnung_bericht_hu
        condition: form.entscheid_bericht_hu_mahnung.entscheid_bericht_hu_mahnung_erfasst
          == `nein`
      triggers:
      - type: UntersuchungsStandSetzen
        value: code:10023:02
    beurteilung_hu:
      key: d0ea8e1c-de9e-4de5-acae-0521e0947e9f
      time_period: 7
      title: 
        de: Beurteilung HU Amt
        fr: Évaluation EP Office
        it: Ufficio Valutazione EP
      steps:
      - key: 57cd139d-3524-4250-bd11-7530fe40eecf
        time_period: 7
        title: 
          de: Eingegangener Bericht
          fr: Rapport reçu
          it: Rapporto ricevuto
        type: document
        optional: true
      - key: d03d1671-6d54-4b18-8f77-f62144720d8f
        time_period: 7
        title: 
          de: Beurteilung HU Kanton vorhanden?
          fr: Évaluation EP canton disponible ?
          it: Valutazione EP Canton disponibile?
        type: form
        optional: true
        name: entscheid_beurteilung_hu_kanton_vorhanden
        fields:
        - name: entscheid_beurteilung_hu_kanton_vorhanden_erfasst
          type: str
          choices:
          - label: 
              de: Beurteilung HU vorhanden
              fr: Évaluation Examen principal disponible
              it: Valutazione dell'ispezione principale disponibile
            value: ja
          - label: 
              de: keine Beurteilung HU vorhanden
              fr: Aucune évaluation Examen principal disponible
              it: Non è disponibile la valutazione dell'ispezione principale
            value: nein
      - key: b5bd2658-71bb-4a14-8c5e-a58edda2a217
        time_period: 7
        title: 
          de: Stellungnahme Kanton
          fr: Prise de position du canton
          it: Dichiarazione cantonale
        type: document
        optional: true
      - key: 30a5b2d6-0644-480a-b3ba-0ffbea810da8
        time_period: 7
        title: 
          de: Beurteilung HU abgeschlossen
          fr: Évaluation EP terminée
          it: Valutazione EP completata
        type: form
        optional: true
        name: entscheid_beurteilung_hu_kanton
        fields:
        - name: entscheid_beurteilung_hu_kanton_erfasst
          type: bool
          label: 
            de: Die Beurteilung HU des Berichtes ist abgeschlossen, Standortdaten sind (falls notwendig) nachgetragen. Allfällige Stellungnahme zum Bericht ist bereit zum Versand.
            fr: L'évaluation de l'examen principal du rapport est terminée, les données de localisation ont été ajoutées (si nécessaire). Les éventuelles prises de position sur le rapport sont prêtes à être envoyées.
            it: La valutazione principale del rapporto è stata completata, i dati di localizzazione sono stati aggiunti (se necessario). Eventuali commenti sul rapporto sono pronti per l'invio.
      - key: db00a226-0a59-4470-ae99-39b7bae4a405
        time_period: 7
        title: 
          de: Stellungnahme zur Untersuchung direkt mit einer IHO oder separat?
          fr: Prise de position sur l'enquête directement avec une OVP ou séparément ?
          it: Dichiarazione sull'indagine direttamente con un OP o separatamente?
        type: form
        name: entscheid_beurteilung_hu_iho
        fields:
        - name: entscheid_beurteilung_hu_iho_erfasst
          type: str
          choices:
          - label: 
              de: Ja, Stellungnahme zum Bericht wird in IHO integriert
              fr: Oui, la prise de position sur le rapport est intégrée dans l'OVP
              it: Sì, la dichiarazione sul rapporto sarà integrata in OP.
            value: ja
          - label: 
              de: Nein, separate Stellungnahme
              fr: Non, prise de position séparée
              it: No, dichiarazione separata
            value: nein
      links:
      - task_ref: anhoerung_inhaber_hu
        condition: form.entscheid_beurteilung_hu_iho.entscheid_beurteilung_hu_iho_erfasst
