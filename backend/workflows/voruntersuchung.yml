    ergaenzung_hu:
      key: 216df8f8-e262-402b-a2f7-d76bc2de2815
      time_period: 7
      title: 
        de: Ergänzende HU?
        fr: EP complémentaire ?
        it: IP supplementare?
      steps:
      - key: b51628fd-80e9-4e37-906b-fcfcc960e2e6
        time_period: 7
        title: 
          de: Verlauf nach HU
