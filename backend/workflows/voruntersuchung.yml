        type: form
        name: entscheid_verlauf_nach_hu
        fields:
        - name: entscheid_verlauf_nach_hu_erfasst
          type: str
          choices:
          - label: 
              de: TU nicht nötig, Standort abschl. beurteilbar
              fr: ET non nécessaire, site évaluable de manière définitive
              it: IT non necessario, l'ubicazione può essere valutata in modo definitivo
            value: abschluss
          - label: 
              de: TU nötig, Pflichtenheft in HU bereits vorhanden
              fr: ET nécessaire, cahier des charges déjà présent dans l'enquête principale
              it: IT richiesto, specifiche già disponibili nell'ispezione principale
            value: tu
          - label: 
              de: TU nötig, Pflichtenheft muss nachgereicht werden
              fr: ET nécessaire, le cahier des charges doit être fourni ultérieurement
              it: IT richiesto, le specifiche devono essere presentate successivamente
            value: tu_pflichtenheft
          - label: 
              de: Es braucht eine ergänzende HU
              fr: Il faut une enquête principale complémentaire
              it: È necessario un HU supplementare
            value: hu
      links:
      - task_ref: abschluss
        condition: form.entscheid_verlauf_nach_hu.entscheid_verlauf_nach_hu_erfasst
          == `abschluss`
      - task_ref: tu_pflichtenheft
        condition: form.entscheid_verlauf_nach_hu.entscheid_verlauf_nach_hu_erfasst
          == `tu_pflichtenheft`
      - task_ref: tu_bericht
        condition: form.entscheid_verlauf_nach_hu.entscheid_verlauf_nach_hu_erfasst
          == `tu`
      - task_ref: start_hu
