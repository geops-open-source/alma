    stellungnahme_anhoerung_inhaber_hu:
      key: b5e8b904-c3d1-489c-92e9-e10cb8bccf32
      time_period: 7
      title: 
        de: Reaktion Anhörung Inhaber zur HU
        fr: Réaction Audition du titulaire pour l'enquête principale
        it: Supporto per il cuscinetto di reazione per l'indagine principale
      steps:
      - key: 3c8a141f-1ecf-4d22-899b-2d816a25caf3
        time_period: 7
        title: 
          de: Stellungnahme Inhaber
          fr: Prise de position du propriétaire
